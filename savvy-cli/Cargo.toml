[package]
name = "savvy-cli"
description = "A CLI for savvy framework"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

# Unlike the savvy crate (MSRV 1.81), savvy-cli requires a newer Rust because
# the dependencies (e.g. clap, toml) use Rust 2024 edition.
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4", features = ["derive"] }
async-process = "2"
futures-lite = "2"

savvy-bindgen = { version = "0.10.2", path = "../savvy-bindgen", features = [
    "use_formatter",
] }
dirs = "6"
toml = "1.0"

[package.metadata.dist]
dist = true
